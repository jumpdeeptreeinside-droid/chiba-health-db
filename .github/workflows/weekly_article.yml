name: 週次 記事自動生成

on:
  # ── 2026-08-16 週次スケジュールを無効化（削除ではない）─────────────────
  # 理由: 千葉県は Vol.1–10 で**完結した**。次に何を出すかはまだ決まっていない。
  #   決まっていないものを毎週失敗させ続けると、失敗メールがノイズになる。
  #   そしてノイズは本物の失敗を隠す——2026-08-15〜16に crosshealthjp の deploy が
  #   16回連続で失敗しても丸1日誰も気づかなかったのは、まさにこの構造だった。
  #   止めるのは撤退ではなく、次の失敗に気づける状態を保つこと。
  # 🔑 再開のしかた: 下の cron 行のコメントを外すだけ。ただし**その前に**
  #   article_generator/vol_state.json の vol_schedule に次の号（region と note）を
  #   足しておくこと。足さずに再開すると、また毎週 Vol.N 未登録で落ちる。
  #   詳しくは article_generator/README_再開のしかた.md
  # ⚠️ vol_state.json は消さないこと（completed_vols=[1..10] が完結の記録そのもの）
  # schedule:
  #   # 毎週日曜 深夜0時 JST（= UTC 日曜 15:00）
  #   - cron: '0 15 * * 0'
  workflow_dispatch:
    inputs:
      vol_override:
        description: '生成するVol番号（空欄=自動）'
        required: false
        default: ''

concurrency:
  group: weekly-article
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # ── 1. このリポジトリをチェックアウト ──────────────
      - name: chiba-health-db をチェックアウト
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── 2. Python セットアップ ─────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install anthropic pandas pyarrow

      # ── 3. 記事ドラフト生成 ───────────────────────────
      - name: 記事ドラフト生成
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python article_generator/generate_draft.py

      # ── 4. obsidian-brain をクローン ──────────────────
      - name: obsidian-brain をクローン
        env:
          OBSIDIAN_PAT: ${{ secrets.OBSIDIAN_PAT }}
        run: |
          git clone \
            https://x-access-token:${OBSIDIAN_PAT}@github.com/jumpdeeptreeinside-droid/obsidian-brain.git \
            obsidian_clone

      # ── 5. ドラフトを obsidian-brain にコピー ─────────
      - name: ドラフトを vol フォルダに配置
        run: |
          VOL_NUM="${{ steps.generate.outputs.vol_num }}"
          FILENAME="${{ steps.generate.outputs.draft_filename }}"
          DEST="obsidian_clone/CrossHealth_company/communications/vol${VOL_NUM}"
          mkdir -p "$DEST"
          cp "output/${FILENAME}" "$DEST/"
          # 圏域マップ（共通素材）も配置して【画像：iryo_ken_map.png】を解決
          cp "obsidian_clone/CrossHealth_company/communications/iryo_ken_map.png" "$DEST/" 2>/dev/null || echo "map not found (skip)"
          echo "コピー先: $DEST/$FILENAME"

      # ── 6. todo.md に「ファクトチェック待ち」を追記 ───
      - name: todo.md を更新
        run: |
          VOL_NUM="${{ steps.generate.outputs.vol_num }}"
          REGION="${{ steps.generate.outputs.region }}"
          TODAY=$(date '+%Y-%m-%d')
          TODO_PATH="obsidian_clone/CrossHealth_company/secretary/todo.md"
          python3 - <<EOF
          import re, datetime
          path = "$TODO_PATH"
          content = open(path, encoding='utf-8').read()
          new_item = (
              "\n- [ ] **【🤖自動生成 ${TODAY}】Vol.${VOL_NUM}（${REGION}圏域）"
              "ファクトチェック待ち → note公開**\n"
              "  - ドラフト: \`communications/vol${VOL_NUM}/\`\n"
          )
          # 「## 🔴 今日・明日やること」セクションの直後に挿入
          content = content.replace(
              "## 🔴 今日・明日やること\n",
              "## 🔴 今日・明日やること\n" + new_item,
              1
          )
          open(path, 'w', encoding='utf-8').write(content)
          print("todo.md 更新完了")
          EOF

      # ── 7. obsidian-brain にコミット & プッシュ ───────
      - name: obsidian-brain にコミット
        env:
          OBSIDIAN_PAT: ${{ secrets.OBSIDIAN_PAT }}
        run: |
          VOL_NUM="${{ steps.generate.outputs.vol_num }}"
          REGION="${{ steps.generate.outputs.region }}"
          cd obsidian_clone
          git config user.name  "chiba-health-db[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "CrossHealth_company/communications/vol${VOL_NUM}/"
          git add "CrossHealth_company/secretary/todo.md"
          git diff --staged --quiet || git commit -m \
            "feat(spotter): Vol.${VOL_NUM} ${REGION}圏域 ドラフト自動生成 $(date '+%Y-%m-%d')"
          git push

      # ── 8. vol_state.json をコミット ──────────────────
      - name: vol_state.json をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add article_generator/vol_state.json
          git diff --staged --quiet || git commit -m \
            "chore: vol_state.json 更新 (Vol.${{ steps.generate.outputs.vol_num }} 完了)"
          git push origin HEAD:master

      # ── 9. 失敗時ログ保存 ──────────────────────────────
      - name: ログをアップロード（失敗時のみ）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
